[project]
name = "hass-mqtt-agent"
version = "0.1.0"
description = "Windows service agent for Home Assistant PC control via MQTT"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=1.6.1",
    "pywin32>=306",
    "psutil>=5.9.0",
    "pyyaml>=6.0"
]

[project.scripts]
hass-mqtt-agent = "main:main"
